control_dt: 0.02

num_actions: 23

msg_type: "hg"     # "hg" or "go"
imu_type: "pelvis"    # "torso" or "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# 23-DOF G1: same SDK motor indices as 29-DOF, just skip non-existent motors
# Missing on 23-DOF: 13 (waist_roll), 14 (waist_pitch),
#                    20 (left_wrist_pitch), 21 (left_wrist_yaw),
#                    27 (right_wrist_pitch), 28 (right_wrist_yaw)
joint2motor_idx: [0, 1, 2, 3, 4, 5,       # left leg (6)
                  6, 7, 8, 9, 10, 11,     # right leg (6)
                  12,                       # waist yaw only (1)
                  15, 16, 17, 18, 19,     # left arm: shoulder_p/r/y, elbow, wrist_roll (5)
                  22, 23, 24, 25, 26      # right arm: shoulder_p/r/y, elbow, wrist_roll (5)
                  ]

kps: [100, 100, 100, 150, 40, 40,   # left leg
      100, 100, 100, 150, 40, 40,   # right leg
      150,                            # waist yaw
      40, 40, 40, 40, 20,           # left arm (5)
      40, 40, 40, 40, 20]           # right arm (5)

kds: [2, 2, 2, 4, 2, 2,   # left leg
      2, 2, 2, 4, 2, 2,   # right leg
      4,                    # waist yaw
      5, 5, 5, 5, 1,      # left arm (5)
      5, 5, 5, 5, 1]      # right arm (5)

default_angles: [-0.2, 0.0, 0.0, 0.4, -0.2, 0.0,   # left leg
                 -0.2, 0.0, 0.0, 0.4, -0.2, 0.0,   # right leg
                 0,                                    # waist yaw
                 0, 0.4, 0, 1.2, 0.0,               # left arm (5)
                 0, -0.4, 0, 1.2, 0.0               # right arm (5)
                 ]

ang_vel_scale: 0.8
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 1.0

# Mapping from 29-DOF policy output index to 23-DOF config index
# This is used by the retargeting script
# Format: policy_29dof_index -> config_23dof_index
# policy indices 0-11 (legs) -> config 0-11
# policy index 12 (waist_yaw) -> config 12
# policy indices 13,14 (waist_roll/pitch) -> SKIP
# policy indices 15-19 (left arm 5) -> config 13-17
# policy indices 20,21 (left wrist p/y) -> SKIP
# policy indices 22-26 (right arm 5) -> config 18-22
# policy indices 27,28 (right wrist p/y) -> SKIP
