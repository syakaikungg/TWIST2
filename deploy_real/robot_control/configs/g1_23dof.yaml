# G1 23DOF Configuration
# 腰: waist_yaw のみ (waist_roll=13, waist_pitch=14 は固定)
# 腕: shoulder×3 + elbow + wrist_roll (wrist_pitch, wrist_yaw は固定)
#
# ポリシー出力 (23DOF) → 実機モーターインデックス (29DOFハードウェア)
# [0-5]:   左脚      → motors 0-5
# [6-11]:  右脚      → motors 6-11
# [12]:    waist_yaw → motor 12
# [13-17]: 左腕      → motors 15,16,17,18,19 (13,14 skip)
# [18-22]: 右腕      → motors 22,23,24,25,26 (20,21,27,28 skip)

control_dt: 0.02

num_actions: 23

msg_type: "hg"     # "hg" or "go"
imu_type: "pelvis"    # "torso" or "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# ポリシー出力インデックス → 実機モーターインデックス
# 固定された関節 (13,14,20,21,27,28) はスキップ
joint2motor_idx: [0, 1, 2, 3, 4, 5,       # 左脚 (6)
                  6, 7, 8, 9, 10, 11,     # 右脚 (6)
                  12,                      # waist_yaw (1)
                  15, 16, 17, 18, 19,     # 左腕 (5): skip motors 13,14,20,21
                  22, 23, 24, 25, 26      # 右腕 (5): skip motors 27,28
                  ]

# PD gains (23DOF)
kps: [100, 100, 100, 150, 40, 40,   # 左脚 (6)
      100, 100, 100, 150, 40, 40,   # 右脚 (6)
      150,                          # waist_yaw (1)
      40, 40, 40, 40, 20,           # 左腕 (5): sh_p, sh_r, sh_y, elbow, wr_r
      40, 40, 40, 40, 20]           # 右腕 (5)

kds: [2, 2, 2, 4, 2, 2,            # 左脚 (6)
      2, 2, 2, 4, 2, 2,            # 右脚 (6)
      4,                            # waist_yaw (1)
      5, 5, 5, 5, 1,               # 左腕 (5)
      5, 5, 5, 5, 1]               # 右腕 (5)

# Default angles (23DOF)
default_angles: [-0.2, 0.0, 0.0, 0.4, -0.2, 0.0,    # 左脚 (6)
                 -0.2, 0.0, 0.0, 0.4, -0.2, 0.0,    # 右脚 (6)
                 0.0,                                # waist_yaw (1)
                 0.0, 0.4, 0.0, 1.2, 0.0,           # 左腕 (5)
                 0.0, -0.4, 0.0, 1.2, 0.0           # 右腕 (5)
                 ]

# 固定関節のデフォルト角度 (実機に送信する値)
fixed_joint_angles:
  waist_roll: 0.0       # motor 13
  waist_pitch: 0.0      # motor 14
  left_wrist_pitch: 0.0  # motor 20
  left_wrist_yaw: 0.0    # motor 21
  right_wrist_pitch: 0.0 # motor 27
  right_wrist_yaw: 0.0   # motor 28

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.5


