<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360度カメラ 表示</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101010; color: #ececea;
    font: 15px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  #panel { position: fixed; left: 12px; top: 12px; max-width: min(560px, calc(100vw - 24px)); background: rgba(20, 20, 19, 0.82);
    border: 1px solid #3a3a37; border-radius: 8px; padding: 12px 14px; }
  #status { font-weight: 600; }
  #stats { font-size: 13px; color: #a3a39e; word-break: break-all; }
  #warn { font-size: 13px; color: #f6ad55; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #63a4e8; background: #2b6cb0; color: #fff; cursor: pointer; margin: 8px 8px 0 0; }
  button.sub { background: transparent; color: #ececea; border-color: #555; }
  button:disabled { opacity: 0.45; cursor: default; }
  #video { width: 240px; max-width: 100%; aspect-ratio: 2 / 1; background: #000; border-radius: 4px; margin-top: 8px; display: block; }
  .help { font-size: 12.5px; color: #a3a39e; margin-top: 6px; }
</style>
</head>
<body>
<div id="panel">
  <div id="status">準備中</div>
  <div id="stats">-</div>
  <div id="warn"></div>
  <button id="vr" disabled>VRで見る</button>
  <button id="reconnect" class="sub">再接続</button>
  <button id="yawL" class="sub">正面 ←</button>
  <button id="yawR" class="sub">正面 →</button>
  <video id="video" autoplay muted playsinline></video>
  <div class="help">VR中: A か X で VR を終わる（PICO のホームボタンでも抜けられる）。スティック左右で正面を回す、B か Y で正面を戻す、トリガーで情報表示の切替。画面ではドラッグで見回し。</div>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
